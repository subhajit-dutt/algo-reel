<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>AlgoReel · Wireframes</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="notebook.css"/>

  <style>
    /* Tweak-driven overrides */
    html[data-annotations="off"] .annot { display: none; }
    html[data-responsive="off"] [data-rn] { display: none; }
    html[data-stickies="off"] [data-sticky] { display: none; }

    html[data-paper="warm"] { --paper: #f1e6c2; --paper-tint: #f8efc6; --paper-warm: #ecdca0; }
    html[data-paper="cool"] { --paper: #e9eaef; --paper-tint: #f1f2f6; --paper-warm: #dde0eb; --grid: rgba(40,60,110,0.10); --grid-strong: rgba(40,60,110,0.18); }
  </style>

  <script>
    // Guard: the design-canvas restores pan/zoom from localStorage on every load.
    // If a previous session ended in a weird off-screen pan, every reload puts
    // the canvas off-screen too. Clear obviously-bad state (anything > 4000px
    // from origin) before the canvas script runs.
    try {
      const k = 'dc-viewport:' + location.pathname;
      const v = JSON.parse(localStorage.getItem(k) || 'null');
      if (v && (Math.abs(v.x) > 4000 || Math.abs(v.y) > 4000 || !(v.scale > 0))) {
        localStorage.removeItem(k);
      }
    } catch (e) {}
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="wf-helpers.jsx"></script>
  <script type="text/babel" src="wf-create.jsx"></script>
  <script type="text/babel" src="wireframes.jsx"></script>
</body>
</html>
